<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap Example</title>
        <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    </head>

    <body>
        <div class="form-check">
            <label for="exampleCheck" class="form-check-label">Check Me Out</label>
            <p></p>
            <input type="form-check-input" type="checkbox" id="exampleCheck">
        </div>

        <div class="form-check">
            <input type="radio" class="form-check-input" name="exampleRadios" id="radio1" value="option1" checked>
            <label for="radio1" class="form-check-label">Option 1</label>
        </div>
        <div class="form-check">
            <input type="radio" class="form-check-input" name="exampleRadios" id="radio2" value="option2">
            <label for="radio2" class="form-check-label">Option 2</label>
        </div>
    </body>
</html>
