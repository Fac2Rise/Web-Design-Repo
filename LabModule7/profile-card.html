<!DOCTYPE html>
<html>
    <head>
         <meta charset="utf-8">
        <meta name="viewport" content="width=devie-width, initial-scale=1.0">
        <title>Transparent Image Text</title>
        <link rel="stylesheet" href="profile-card.css">
    </head>

    <body>
        <div class="profile-card">
            <div class="card-header">
                <h2>User Profile Card</h2>
            </div>

            <img src="images/junhan.jpg" alt="Jun Han" class="profile-image">
            <h3 class="profile-name">Lim Jun Han</h3>
            <p class="profile-title">Student and Gamer</p>
            <p class="profile-education">University Malaysia Terengganu</p>
            <div class="social-links">
                <a href="https://www.google.com/" class="social-icon"><i class="fa fa-globe">Google</i></a>
                <a href="https://www.x.com/" class="social-icon"><i class="fa fa-twitter">X</i></a>
                <a href="https://www.linkedin.com/" class="social-icon"><i class="fa fa-linkedin">Linkedin</i></a>
                <a href="https://www.meta.com/" class="social-icon"><i class="fa fa-facebook">Meta</i></a>
            </div>
            <button class="contact-btn">Contact</button>
        </div>
    </body>
</html>
