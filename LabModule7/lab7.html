<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=devie-width, initial-scale=1.0">
        <title>Transparent Image Text</title>
        <link rel="stylesheet" href="lab7.css">
    </head>

    <body>
        <div class="image-container">
            <img src="images/myimage.avif" alt="Beautiful Scenery">
            <div class="overlay-text">Jun Han's Flower Shop</div>
        </div>

        <div class="image-container overlay-text"> 
            <div class="form-container">
                <h2>Login</h2>
                <form action="#" method="post">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter Username" required>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <button type="button" id="loginButton">Login</button>
                </form>
            </div>
        </div>  

        <script src="lab7.js"></script>
    </body>
</html>
